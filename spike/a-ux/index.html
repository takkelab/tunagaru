<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tunagaru 試作A</title>
<style>
:root {
  --bg: #f6f3ee; --surface: #fffdf9; --ink: #26231f; --muted: #6f685e; --line: #e4ddd2;
  --accent: #b5532f; --accent-soft: #f5e3d9; --ok: #3f7d4e; --ok-soft: #e1efe3;
  --warn: #9a6a00; --warn-soft: #f7ecd0; --mark: #fbe7a1; --shadow: 0 1px 2px rgb(0 0 0 / 8%), 0 6px 18px rgb(0 0 0 / 7%);
  --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
  --sans: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1a18; --surface: #252320; --ink: #ece6dc; --muted: #a79f93; --line: #3a3631;
    --accent: #e4865f; --accent-soft: #3d2a21; --ok: #7fbf8d; --ok-soft: #22342a;
    --warn: #e0b453; --warn-soft: #3a3020; --mark: #5a4a1a; --shadow: 0 1px 2px rgb(0 0 0 / 40%);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 var(--sans); }
a { color: var(--accent); }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.logo { font: 600 18px var(--serif); letter-spacing: .04em; text-decoration: none; color: var(--ink); }
.logo small { font: 12px var(--sans); color: var(--muted); margin-left: 6px; }
nav { display: flex; gap: 4px; margin-left: auto; align-items: center; }
nav a { text-decoration: none; color: var(--muted); padding: 4px 10px; border-radius: 999px; }
nav a.on { color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
.toggle { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-right: 8px; cursor: pointer; }
main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 80px; }
.person { margin: 26px 0 8px; }
.person-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 2px solid var(--line); padding-bottom: 6px; }
.person-head a { font: 600 21px var(--serif); color: var(--ink); text-decoration: none; }
.person-head small { color: var(--muted); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 22px 18px; padding: 18px 4px 4px; align-items: end; }
.tile { cursor: pointer; position: relative; }
.cover { width: 100%; aspect-ratio: 2 / 3; border-radius: 4px; overflow: hidden; box-shadow: var(--shadow); background: var(--surface); display: flex; align-items: center; justify-content: center; position: relative; transition: transform .15s; }
.cover.music { aspect-ratio: 1 / 1; }
.d-head .cover { width: 120px; flex: none; }
.tile:hover .cover { transform: translateY(-3px); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph { padding: 12px; text-align: center; font: 600 15px/1.5 var(--serif); color: var(--ink); background: repeating-linear-gradient(135deg, var(--accent-soft), var(--accent-soft) 6px, var(--surface) 6px, var(--surface) 12px); width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; }
.ph small { display: block; font: 12px var(--sans); color: var(--muted); margin-top: 6px; }
.cap { margin-top: 8px; font-size: 13px; line-height: 1.45; }
.cap b { display: block; font-weight: 600; }
.cap span { color: var(--muted); }
.badge { position: absolute; top: 6px; right: 6px; background: var(--accent); color: #fff; font-size: 11px; border-radius: 999px; padding: 1px 7px; z-index: 1; }
.dot { position: absolute; top: 6px; left: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); border: 2px solid var(--surface); z-index: 1; }
.star-mini { position: absolute; bottom: 6px; right: 6px; color: var(--accent); font-size: 16px; z-index: 1; text-shadow: 0 0 3px var(--surface); }
.empty { color: var(--muted); padding: 24px 0; }
.tag { font-size: 12px; border-radius: 6px; padding: 0 7px; line-height: 20px; white-space: nowrap; }
.tag.unv { background: var(--line); color: var(--muted); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.drawer { position: fixed; inset: 0 0 0 auto; width: min(540px, 100%); background: var(--surface); transform: translateX(100%); visibility: hidden; transition: transform .2s ease; z-index: 10; overflow-y: auto; padding: 22px 24px 60px; }
.drawer.open { transform: none; visibility: visible; box-shadow: -8px 0 30px rgb(0 0 0 / 15%); }
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 25%); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; }
.scrim.open { opacity: 1; pointer-events: auto; }
.close { float: right; border: 0; background: none; font-size: 22px; color: var(--muted); cursor: pointer; }
.d-head { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 8px; }
.d-title { font: 600 22px/1.4 var(--serif); margin: 4px 0; }
.d-sub { color: var(--muted); font-size: 14px; }
.links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 14px; text-decoration: none; display: inline-block; }
.btn.on { color: var(--accent); border-color: var(--accent); }
.btn.primary { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { color: #b33; }
.sec { font-size: 12px; color: var(--muted); margin: 22px 0 4px; letter-spacing: .05em; }
.ev { margin: 12px 0 18px; padding-left: 14px; border-left: 3px solid var(--accent-soft); }
.ev .who { font-weight: 600; font-size: 14px; }
.ev .q { font: 17px/1.85 var(--serif); }
.ev .q::before { content: "「"; } .ev .q::after { content: "」"; }
.ev mark { background: var(--mark); color: inherit; padding: 0 1px; }
.ev .cm { color: var(--muted); font: 15px/1.8 var(--serif); margin-top: 4px; }
.ev .cm::before { content: "… "; }
.ev .tr { color: var(--muted); font-size: 14px; }
.ev .src { font-size: 12px; color: var(--muted); margin-top: 6px; }
.go { display: inline-block; margin-top: 6px; padding: 3px 12px; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; font-size: 13px; }
.actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.others { display: flex; gap: 8px; flex-wrap: wrap; }
#cy { width: 100%; height: calc(100vh - 120px); min-height: 480px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.works { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 16px 12px; margin-top: 8px; }
.wcard .cap .by { color: var(--accent); }
.wact { display: flex; gap: 8px; align-items: center; font-size: 12px; margin-top: 2px; }
.star { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; cursor: pointer; padding: 0 9px; color: var(--muted); }
.star.on { color: var(--accent); border-color: var(--accent); }
body.docked main { max-width: none; margin: 0 min(540px, 100%) 0 0; }
body.docked .drawer.open { box-shadow: -1px 0 0 var(--line); }
.find { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.graph-help { font-size: 12px; color: var(--muted); margin: 14px 0 8px; }
.avatar { width: 104px; height: 104px; margin: 0 auto; border-radius: 50%; overflow: hidden; box-shadow: var(--shadow); background: var(--accent-soft); display: flex; align-items: center; justify-content: center; transition: transform .15s; }
.d-head .avatar { width: 120px; height: 120px; margin: 0; flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }
.avatar span { font: 600 36px var(--serif); color: var(--accent); }
.fans { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
.fan { border: 0; background: none; padding: 0; cursor: pointer; width: 64px; text-align: center; color: var(--ink); font: inherit; }
.fan .avatar { width: 52px; height: 52px; box-shadow: none; }
.fan .avatar span { font-size: 20px; }
.fan-name { display: block; font-size: 11px; margin-top: 4px; color: var(--muted); line-height: 1.3; }
.rec-head { display: flex; align-items: center; gap: 10px; margin: 22px 0 6px; font-weight: 600; }
.rec-head .avatar { width: 36px; height: 36px; margin: 0; flex: none; box-shadow: none; }
.rec-head .avatar span { font-size: 16px; }
.fan:hover .avatar { transform: translateY(-2px); }
.hint { font-size: 12px; color: var(--muted); }
.hidden-list { margin: 36px 0 0; color: var(--muted); font-size: 14px; }
.hidden-list summary { cursor: pointer; }
.hidden-row { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; display: flex; gap: 12px; align-items: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; font-size: 14px; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast .btn { padding: 2px 10px; }
@media (max-width: 640px) { .shelf { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="#/">tunagaru<small>試作A・手入力のデータ</small></a>
    <nav id="nav"></nav>
  </div>
</header>
<main id="main"><p class="empty">読み込み中…</p></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-live="polite"></aside>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script>
const STORE_NAME = "tunagaru-spike-a3";
let D, S = { hidden: {}, curious: {}, onlyOverlap: false };
try { S = { ...S, ...JSON.parse(localStorage.getItem(STORE_NAME) || "{}") }; } catch {}
const save = () => { try { localStorage.setItem(STORE_NAME, JSON.stringify(S)); } catch {} };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const $ = (id) => document.getElementById(id);
const seed = (id) => D.seeds.find((s) => s.id === id);
const creator = (id) => D.creators.find((c) => c.id === id);
const fmt = (sec) => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;

// 引用に、作り手か作品の固有名詞が入っているか（入っていない根拠は使わない）
const names = (c, work) => [c.name, ...c.aliases, ...(work ? [work, ...(c.workAliases?.[work] || [])] : [])];
const hasNoun = (ev, c) => names(c, ev.work).some((n) => ev.quote.includes(n));
function highlight(text, ns) {
  let out = esc(text);
  for (const n of [...ns].sort((a, b) => b.length - a.length)) out = out.split(esc(n)).join(`<mark>${esc(n)}</mark>`);
  return out;
}
function link(ev) {
  const src = D.sources[ev.source];
  if (src.kind === "video" && ev.startSec != null) return `${src.url}&t=${ev.startSec}s`;
  const q = ev.quote.replace(/^[「『]|[」』。]$/g, "");
  const frag = q.length <= 24 ? encodeURIComponent(q) : `${encodeURIComponent(q.slice(0, 14))},${encodeURIComponent(q.slice(-8))}`;
  return `${src.url}#:~:text=${frag}`;
}
const shopUrl = (c, work) => { const q = encodeURIComponent(`${work || ""} ${c.name}`.trim()); return c.domain === "music" ? `https://open.spotify.com/search/${q}` : `https://www.amazon.co.jp/s?k=${q}`; };

// 棚の1マス = 起点 × 作り手 × 作品（作品がなければ「作家として」）
function tiles(likes) {
  const out = [];
  for (const l of likes) {
    const c = creator(l.creator);
    const evs = l.evidence.filter((e) => hasNoun(e, c));
    const byWork = new Map();
    for (const e of evs) { const k = e.work || ""; if (!byWork.has(k)) byWork.set(k, []); byWork.get(k).push(e); }
    for (const [w, es] of byWork) out.push({ key: `${l.id}|${w}`, like: l, c, work: w || null, evs: es });
  }
  return out;
}
// 非表示にしたマスは、棚にも重なりの人数にも数えない
const allTiles = () => tiles(D.likes);
const visible = () => allTiles().filter((t) => !S.hidden[t.key]);
const overlapN = (cid) => new Set(visible().filter((t) => t.c.id === cid).map((t) => t.like.seed)).size;
const tileName = (t) => (t.work ? `『${t.work}』` : t.c.name);
const asWhole = (c) => (c.domain === "music" ? "アーティストとして" : "作家として");
const risky = (evs) => evs.some((e) => e.attribution === "third_party" || D.sources[e.source].autoCaption);

const coverCache = {};
function coverHtml(t) {
  const cls = `cover${t.c.domain === "music" ? " music" : ""}`;
  const id = `cv-${Math.random().toString(36).slice(2)}`;
  const k = `${t.c.domain}|${t.work || ""}|${t.c.name}`;
  const ph = `<div class="ph">${esc(t.work || t.c.name)}<small>${t.work ? esc(t.c.name) : asWhole(t.c)}</small></div>`;
  queueMicrotask(() => loadCover(id, k, t));
  return `<div class="${cls}" id="${id}">${coverCache[k] ? `<img src="${esc(coverCache[k])}" alt="">` : ph}</div>`;
}
const pending = {};
async function loadCover(id, k, t) {
  if (!(k in coverCache)) {
    pending[k] ??= fetch(`/cover?domain=${t.c.domain}&title=${encodeURIComponent(t.work || "")}&creator=${encodeURIComponent(t.c.name)}`)
      .then((r) => r.json()).then((j) => j.url).catch(() => null);
    coverCache[k] = await pending[k];
  }
  const el = document.getElementById(id);
  if (el && coverCache[k] && !el.querySelector("img")) el.innerHTML = `<img src="${esc(coverCache[k])}" alt="">`;
}
function tileHtml(t) {
  const n = overlapN(t.c.id);
  const ck = t.work ? `${t.c.id}|${t.work}` : "";
  return `<div class="tile" data-tile="${esc(t.key)}">
    ${n >= 2 ? `<span class="badge" title="${n}人が${esc(t.c.name)}を挙げています">${n}人</span>` : ""}
    ${risky(t.evs) ? '<span class="dot" title="要注意の根拠があります"></span>' : ""}
    ${ck && S.curious[ck] ? '<span class="star-mini">★</span>' : ""}
    ${coverHtml(t)}
    <div class="cap"><b>${esc(t.work ? `『${t.work}』` : t.c.name)}</b><span>${esc(t.work ? t.c.name : asWhole(t.c))}</span></div></div>`;
}

function renderNav(view) {
  const n = Object.keys(S.curious).length;
  $("nav").innerHTML = `<label class="toggle"><input type="checkbox" id="only" ${S.onlyOverlap ? "checked" : ""}> 重なりだけ</label>
    <a href="#/" class="${view === "home" ? "on" : ""}">作品</a><a href="#/graph" class="${view === "graph" ? "on" : ""}">つながり</a><a href="#/curious" class="${view === "curious" ? "on" : ""}">気になる${n ? ` (${n})` : ""}</a>`;
  $("only").onchange = (e) => { S.onlyOverlap = e.target.checked; save(); render(); };
}
function personSection(s) {
  let ts = visible().filter((t) => t.like.seed === s.id && t.work);
  if (S.onlyOverlap) ts = ts.filter((t) => overlapN(t.c.id) >= 2);
  if (S.onlyOverlap && !ts.length) return "";
  return `<section class="person"><div class="person-head"><a href="#/seed/${s.id}">${esc(s.name)}</a><small>${esc(s.role)} · ${ts.length}</small></div>
    <div class="shelf">${ts.map(tileHtml).join("") || '<p class="empty">まだありません</p>'}</div></section>`;
}
const portraitCache = {};
const portraitPending = {};
function avatarHtml(c) {
  const id = `av-${Math.random().toString(36).slice(2)}`;
  queueMicrotask(() => loadPortrait(id, c));
  const url = portraitCache[c.name]?.url;
  return `<div class="avatar" id="${id}">${url ? `<img src="${esc(url)}" alt="">` : `<span>${esc([...c.name][0])}</span>`}</div>`;
}
async function loadPortrait(id, c) {
  if (!(c.name in portraitCache)) {
    portraitPending[c.name] ??= fetch(`/portrait?name=${encodeURIComponent(c.name)}${c.aliases.map((a) => `&alt=${encodeURIComponent(a)}`).join("")}`).then((r) => r.json()).catch(() => null);
    portraitCache[c.name] = await portraitPending[c.name];
  }
  const url = portraitCache[c.name]?.url;
  const el = document.getElementById(id);
  if (el && url && !el.querySelector("img")) el.innerHTML = `<img src="${esc(url)}" alt="">`;
}
const kindOf = (c) => (c.domain === "music" ? "アーティスト" : "作家");
function openPerson(likeId) {
  const l = D.likes.find((x) => x.id === likeId); if (!l) return;
  const c = creator(l.creator);
  const mine = allTiles().filter((t) => t.like.id === likeId);
  const hiddenAll = mine.every((t) => S.hidden[t.key]);
  const others = [...new Map(visible().filter((t) => t.c.id === c.id && t.like.seed !== l.seed).map((t) => [t.like.id, t])).values()];
  openKey = `p:${likeId}`;
  const wiki = `https://ja.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(c.name)}`;
  $("drawer").innerHTML = `<button class="close" data-close>×</button>
    <div class="d-head">${avatarHtml(c)}<div>
      <div class="d-title">${esc(c.name)}</div><div class="d-sub">${kindOf(c)}</div>
      <div class="links"><a class="btn" href="${wiki}" target="_blank" rel="noopener">Wikipedia ↗</a>
        <a class="btn" href="${shopUrl(c, "")}" target="_blank" rel="noopener">${c.domain === "music" ? "Spotify で聴く" : "Amazon で見る"} ↗</a></div>
    </div></div>
    ${recHead(seed(l.seed))}
    ${mine.filter((t) => !S.hidden[t.key]).flatMap((t) => t.evs.map((e) => evHtml(e, t, true))).join("")}
    <div class="actions">${hiddenAll ? "" : `<button class="btn" data-hide-person="${esc(likeId)}">非表示にする</button><span class="hint">違うと思ったら</span>`}</div>
    ${others.length ? `<div class="sec">ほかに ${esc(c.name)} を挙げている人</div><div class="others">${others.map((o) => `<button class="btn" data-person="${esc(o.like.id)}">${esc(seed(o.like.seed).name)}</button>`).join("")}</div>` : ""}`;
  showDrawer();
}
// 根拠の見出し: 起点のアイコンと「〇〇のオススメ」
const recHead = (sd) => `<div class="rec-head">${avatarHtml(sd)}<span>${esc(sd.name)} のオススメ</span></div>`;
function hidePerson(likeId) {
  const l = D.likes.find((x) => x.id === likeId);
  for (const t of allTiles().filter((x) => x.like.id === likeId)) S.hidden[t.key] = Date.now();
  save(); closeDrawer(); render();
  toast(`${esc(seed(l.seed).name)} の ${esc(creator(l.creator).name)} を非表示にしました <button class="btn" data-unhide-person="${esc(likeId)}">元に戻す</button>`);
}
function unhidePerson(likeId) {
  for (const t of allTiles().filter((x) => x.like.id === likeId)) delete S.hidden[t.key];
  save(); $("toast").classList.remove("show"); render();
}
// 根拠1件分。人の画面では、どの作品の話かを添える（withWork）
function evHtml(e, t, withWork = false) {
  const src = D.sources[e.source];
  const isVideo = src.kind === "video" && e.startSec != null;
  return `<div class="ev">
    ${withWork && t.work ? `<div class="who">『${esc(t.work)}』について</div>` : ""}
    <div class="q">${highlight(e.quote, names(t.c, e.work))}</div>
    ${e.translation ? `<div class="tr">訳: ${esc(e.translation)}</div>` : ""}
    ${e.comment ? `<div class="cm">${esc(e.comment)}</div>` : ""}
    <div class="src">${e.attribution === "third_party" ? '<span class="tag warn">要注意・記者などの記述</span> ' : ""}${src.autoCaption ? '<span class="tag warn">要注意・自動字幕</span> ' : ""}${esc(src.title)}</div>
    <a class="go" href="${link(e)}" target="_blank" rel="noopener">${isVideo ? `▶ ${fmt(e.startSec)} から再生` : "記事のこの箇所を開く ↗"}</a>
  </div>`;
}
// つながり（ノード型）: 点は人だけ（起点と、その人たちが好きな作り手）。線は「好き」。
// 点を押すと、起点からの道筋が濃くなり、図の横にパネルが開く（図は縮むだけで隠れない）。線を押すと根拠が開く。
// 点の状態: 調べ済み（実線の枠）・調べられる（点線の枠、パネルの「＋ 好きな人を探す」）・探している途中。
// 「探す」は試作B・Cでつなぐまで、架空の人（仮の人）で動きだけを見せる。
// 探しても今ある点は動かさず、増えた人だけを元の人の外側に置く。配置と広がりは localStorage に残す
let cy = null;
let selected = null;
const expanding = new Set();
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MOCK_POOL = ["仮の人 あ", "仮の人 い", "仮の人 う", "仮の人 え", "仮の人 お", "仮の人 か", "仮の人 き", "仮の人 く", "仮の人 け", "仮の人 こ"];
const hashOf = (str) => [...str].reduce((h, ch) => (h * 31 + ch.codePointAt(0)) >>> 0, 7);

function mockLikes(nodeId) {
  const h = hashOf(nodeId);
  const picks = new Set();
  for (let k = 0; picks.size < 3; k++) picks.add((h + k * 7 + (h >> (k + 3))) % MOCK_POOL.length);
  return [...picks].map((m) => ({ id: `m:${m}`, label: MOCK_POOL[m] }));
}

function mockElements(parentId, have) {
  const els = [];
  for (const m of mockLikes(parentId)) {
    if (!have.has(m.id)) { els.push({ group: "nodes", data: { id: m.id, label: m.label, kind: "mock" } }); have.add(m.id); }
    els.push({ group: "edges", data: { id: `e:${parentId}>${m.id}`, source: parentId, target: m.id, mock: 1 } });

}

// 選んだ点に届いている起点それぞれからの、いちばん短い道筋（をすべて合わせたもの）
function pathTo(node) {
  let all = node;
  for (const root of cy.nodes('[kind = "seed"]')) {
    const r = cy.elements().aStar({ root, goal: node, directed: true });
    if (r.found) all = all.union(r.path);
  }
  return all;
}
function clearSelection() {

function selectNode(node) {

  path.edges().addClass("path");
  path.nodes().addClass("on-path");
}
function selectEdge(edge) {
  clearSelection();
  edge.addClass("path");

}

function findLikes(id) {
  const node = cy.getElementById(id);
  if (!node.length || expanding.has(id)) return;
  expanding.add(id); refreshNodes();
  if (openKey) reopen(openKey);
  const pulse = setInterval(() => node.toggleClass("pulse"), 400);
  // 本物の調査は数十秒〜数分かかる。試作では1.5秒待つだけにする
  setTimeout(() => {
    clearInterval(pulse); node.removeClass("pulse");
    expanding.delete(id);
    if (!onGraph() || !cy.getElementById(id).length) return;
    S.expanded[id] = Date.now();
    const have = new Set(cy.nodes().map((n) => n.id()));
    const els = mockElements(id, have);
    // 今ある点は動かさない。新しい人だけを、元の人から外へ向かう向きに扇形に置く
    const p = node.position();
    const from = node.incomers("node")[0]?.position();
    const base = from ? Math.atan2(p.y - from.y, p.x - from.x) : 0;
    const fresh = els.filter((el) => el.group === "nodes");
    fresh.forEach((el, k) => {
      const a = base + (k - (fresh.length - 1) / 2) * 0.9;
      let r = 130;
      const at = () => ({ x: p.x + r * Math.cos(a), y: p.y + r * Math.sin(a) });
      while (r < 400 && cy.nodes().some((n) => Math.hypot(n.position().x - at().x, n.position().y - at().y) < 70)) r += 60;
      el.position = at();
    });
    const addedEles = cy.add(els);
    refreshNodes();
    savePositions();
    keepInView(addedEles.nodes().union(node));
    if (selected?.id() === id) selectNode(node);
    if (openKey) reopen(openKey);
    if (!$("reset-mock")) $("main").querySelector(".graph-help").insertAdjacentHTML("beforeend", ` ${resetButton()}`);
    bindReset();
  }, 1500);
}

  const w = cy.width(), h = cy.height(), m = 60;

      <div class="d-sub">${esc(t.work ? t.c.name : `${asWhole(t.c)}挙げられています`)}</div>
      <div class="links">${ck ? `<button class="btn ${S.curious[ck] ? "on" : ""}" data-star="${esc(ck)}">${S.curious[ck] ? "★ 気になる" : "☆ 気になる"}</button>` : ""}
        <a class="btn" href="${shopUrl(t.c, t.work)}" target="_blank" rel="noopener">${t.c.domain === "music" ? "Spotify で聴く" : "Amazon で見る"} ↗</a></div>
    </div></div>
    ${recHead(seed(t.like.seed))}
    ${t.evs.map((e) => evHtml(e, t)).join("")}
    <div class="actions">${S.hidden[t.key]
      ? `<button class="btn" data-unhide="${esc(t.key)}">非表示を解除する</button>`
      : `<button class="btn" data-hide="${esc(t.key)}">非表示にする</button><span class="hint">違うと思ったら</span>`}</div>
    ${others.length ? `<div class="sec">ほかに ${esc(t.c.name)} を挙げている人</div><div class="others">${others.map((o) => `<button class="btn" data-tile="${esc(o.key)}">${esc(seed(o.like.seed).name)}${o.work ? `：『${esc(o.work)}』` : ""}</button>`).join("")}</div>` : ""}`;
  showDrawer();
}
function closeDrawer() {
  openKey = null;
  $("drawer").classList.remove("open"); $("scrim").classList.remove("open");
  if (document.body.classList.contains("docked")) { document.body.classList.remove("docked"); if (onGraph()) cy.resize(); }
  clearSelection();
}
let toastTimer;
function toast(html) {
  $("toast").innerHTML = html; $("toast").classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.remove("show"), 7000);
}
function hide(key) {
  const t = allTiles().find((x) => x.key === key); if (!t) return;
  S.hidden[key] = Date.now(); save(); closeDrawer(); render();
  toast(`${esc(seed(t.like.seed).name)} の ${esc(tileName(t))} を非表示にしました <button class="btn" data-unhide="${esc(key)}">元に戻す</button>`);
}
function unhide(key) { delete S.hidden[key]; save(); $("toast").classList.remove("show"); const o = openKey; render(); if (o) reopen(o); }
function render() {
  const h = location.hash || "#/";
  if (h.startsWith("#/seed/")) { renderNav("seed"); renderSeed(h.slice(7)); }
  else if (h === "#/curious") { renderNav("curious"); renderCurious(); }
  else if (h === "#/graph") { renderNav("graph"); renderGraph(); }
  else { renderNav("home"); renderHome(); }
}
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-tile],[data-person],[data-star],[data-hide],[data-unhide],[data-hide-person],[data-unhide-person],[data-close]");
  if (!t) return;
  if (t.dataset.tile) openDrawer(t.dataset.tile);
  else if (t.dataset.person) openPerson(t.dataset.person);
  else if (t.dataset.hidePerson) hidePerson(t.dataset.hidePerson);
  else if (t.dataset.unhidePerson) unhidePerson(t.dataset.unhidePerson);
  else if (t.dataset.star) { const k = t.dataset.star; if (S.curious[k]) delete S.curious[k]; else S.curious[k] = { at: Date.now(), img: t.dataset.img || null, domain: t.dataset.domain || undefined }; save(); const o = openKey; if (onGraph()) renderNav("graph"); else render(); if (o) reopen(o); }
  else if (t.dataset.hide) hide(t.dataset.hide);
  else if (t.dataset.unhide) unhide(t.dataset.unhide);
  else if (t.dataset.close !== undefined) closeDrawer();
});
$("scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
window.addEventListener("hashchange", () => { closeDrawer(); render(); });
fetch("/data/likes.json").then((r) => { if (!r.ok) throw new Error("spike/data/likes.json がありません"); return r.json(); })
  .then((d) => { D = d; render(); })
  .catch((e) => { $("main").innerHTML = `<p class="empty">${esc(e.message)}</p>`; });
</script>
</body>
</html>
