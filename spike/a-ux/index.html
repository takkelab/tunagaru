<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tunagaru 試作A</title>
<style>
:root {
  --bg: #f6f3ee; --surface: #fffdf9; --ink: #26231f; --muted: #6f685e; --line: #e4ddd2;
  --accent: #b5532f; --accent-soft: #f5e3d9; --ok: #3f7d4e; --ok-soft: #e1efe3;
  --warn: #9a6a00; --warn-soft: #f7ecd0; --shadow: 0 1px 2px rgb(0 0 0 / 6%), 0 4px 16px rgb(0 0 0 / 4%);
  --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
  --sans: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1a18; --surface: #252320; --ink: #ece6dc; --muted: #a79f93; --line: #3a3631;
    --accent: #e4865f; --accent-soft: #3d2a21; --ok: #7fbf8d; --ok-soft: #22342a;
    --warn: #e0b453; --warn-soft: #3a3020; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 var(--sans); }
a { color: var(--accent); }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 980px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.logo { font: 600 18px var(--serif); letter-spacing: .04em; }
.logo small { font: 12px var(--sans); color: var(--muted); margin-left: 6px; }
nav { display: flex; gap: 4px; margin-left: auto; }
nav a { text-decoration: none; color: var(--muted); padding: 4px 10px; border-radius: 999px; }
nav a.on { color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
.seeds { max-width: 980px; margin: 0 auto; padding: 0 16px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 3px 12px; font-size: 13px; cursor: pointer; text-decoration: none; }
.chip.on { border-color: var(--accent); color: var(--accent); }
.chip span { color: var(--muted); margin-left: 4px; }
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 80px; }
h1 { font: 600 22px var(--serif); margin: 4px 0 4px; }
.lead { color: var(--muted); margin: 0 0 20px; }
.card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 18px 20px; margin-bottom: 16px; }
.card-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.creator { font: 600 21px var(--serif); }
.count { font-weight: 600; color: var(--accent); }
.confirm { font-size: 13px; color: var(--muted); }
.row { display: grid; grid-template-columns: 9em 1fr; gap: 4px 14px; padding: 12px 0; border-top: 1px dashed var(--line); cursor: pointer; }
.row:hover { background: color-mix(in srgb, var(--accent-soft) 35%, transparent); }
.who { font-weight: 600; }
.who small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.quote { font: 16px/1.85 var(--serif); }
.quote::before { content: "「"; } .quote::after { content: "」"; }
.meta { grid-column: 2; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.works { color: var(--ink); }
.tag { font-size: 12px; border-radius: 6px; padding: 0 7px; line-height: 20px; white-space: nowrap; }
.tag.unv { background: var(--line); color: var(--muted); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.ovl { background: var(--accent-soft); color: var(--accent); }
.shelf-item { padding: 16px 0; border-top: 1px solid var(--line); cursor: pointer; }
.shelf-item:first-child { border-top: 0; }
.shelf-item .quote { font-size: 18px; }
.shelf-item .meta { margin-top: 6px; }
.shelf-item .creator { font-size: 16px; }
.empty { color: var(--muted); padding: 24px 0; }
.muted-list { margin-top: 24px; font-size: 13px; color: var(--muted); }
.muted-list button { font-size: 12px; }
.drawer { position: fixed; inset: 0 0 0 auto; width: min(520px, 100%); background: var(--surface); transform: translateX(100%); visibility: hidden; transition: transform .2s ease; z-index: 10; overflow-y: auto; padding: 22px 22px 60px; }
.drawer.open { transform: none; visibility: visible; box-shadow: -8px 0 30px rgb(0 0 0 / 15%); }
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 25%); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; }
.scrim.open { opacity: 1; pointer-events: auto; }
.close { float: right; border: 0; background: none; font-size: 22px; color: var(--muted); cursor: pointer; }
.ev { margin: 18px 0; padding-left: 14px; border-left: 3px solid var(--accent-soft); }
.ev .quote { font-size: 17px; }
.ev .tr { color: var(--muted); font-size: 14px; margin-top: 4px; }
.src { font-size: 13px; margin-top: 6px; }
.play { display: inline-block; margin-top: 6px; padding: 3px 12px; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; font-size: 13px; }
.work-line { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
.star { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; cursor: pointer; padding: 1px 10px; color: var(--muted); }
.star.on { color: var(--accent); border-color: var(--accent); }
.actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 14px; cursor: pointer; font: inherit; }
.btn.primary { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { color: #b33; }
.kbd { color: var(--muted); font-size: 12px; }
@media (max-width: 640px) { .row { grid-template-columns: 1fr; } .meta { grid-column: 1; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">tunagaru<small>試作A・手入力のデータ</small></div>
    <nav id="nav"></nav>
  </div>
  <div class="seeds" id="seeds"></div>
</header>
<main id="main"><p class="empty">読み込み中…</p></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-live="polite"></aside>
<script>
const KEY = "tunagaru-spike-a";
let D, S = { status: {}, curious: {} };
try { S = { ...S, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const $ = (id) => document.getElementById(id);
const seed = (id) => D.seeds.find((s) => s.id === id);
const creator = (id) => D.creators.find((c) => c.id === id);
const st = (like) => S.status[like.id] || "unverified";
const live = () => D.likes.filter((l) => st(l) !== "rejected");
const fmt = (sec) => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
const href = (ev) => { const u = D.sources[ev.source].url; return ev.startSec == null ? u : `${u}${u.includes("?") ? "&" : "?"}t=${ev.startSec}s`; };
const shopUrl = (c, work) => { const q = encodeURIComponent(`${work} ${c.name}`); return c.domain === "music" ? `https://open.spotify.com/search/${q}` : `https://www.amazon.co.jp/s?k=${q}`; };
const curiousKey = (c, w) => `${c}|${w}`;

function overlaps() {
  const by = new Map();
  for (const l of live()) { if (!by.has(l.creator)) by.set(l.creator, []); by.get(l.creator).push(l); }
  return [...by.entries()]
    .map(([cid, likes]) => ({ c: creator(cid), likes, n: new Set(likes.map((l) => l.seed)).size,
      ok: new Set(likes.filter((l) => st(l) === "approved").map((l) => l.seed)).size,
      ev: likes.reduce((a, l) => a + l.evidence.length, 0) }))
    .filter((o) => o.n >= 2)
    .sort((a, b) => b.n - a.n || b.ok - a.ok || b.ev - a.ev || a.c.name.localeCompare(b.c.name, "ja"));
}
function overlapCount(cid) { return new Set(live().filter((l) => l.creator === cid).map((l) => l.seed)).size; }
function tags(like) {
  const t = [st(like) === "approved" ? '<span class="tag ok">確認済み</span>' : '<span class="tag unv">未確認</span>'];
  const ev = like.evidence;
  if (ev.some((e) => e.match === "fuzzy")) t.push('<span class="tag warn" title="自動字幕とあいまいに照合した根拠です">要注意・文字起こし</span>');
  if (ev.some((e) => e.attribution === "third_party")) t.push('<span class="tag warn" title="本人の発言ではなく、記者などの記述です">要注意・第三者の記述</span>');
  return t.join("");
}
function sourceBit(ev) {
  const s = D.sources[ev.source];
  return s.kind === "video" && ev.startSec != null ? `▶ ${fmt(ev.startSec)} から` : esc(s.title.split("（")[0].slice(0, 24));
}

function renderNav(view) {
  const n = Object.keys(S.curious).length;
  $("nav").innerHTML = `<a href="#/" class="${view === "overlaps" ? "on" : ""}">重なり</a><a href="#/curious" class="${view === "curious" ? "on" : ""}">気になる ${n ? `(${n})` : ""}</a>`;
  const cur = location.hash.startsWith("#/seed/") ? location.hash.slice(7) : "";
  $("seeds").innerHTML = D.seeds.map((s) => `<a class="chip ${cur === s.id ? "on" : ""}" href="#/seed/${s.id}">${esc(s.name)}<span>${live().filter((l) => l.seed === s.id).length}</span></a>`).join("");
}
function renderOverlaps() {
  const os = overlaps();
  $("main").innerHTML = `<h1>好きな人たちの重なり</h1>
    <p class="lead">${D.seeds.length}人の「好き」のうち、2人以上が挙げている作り手が ${os.length} 件あります。</p>
    ${os.map((o) => `<section class="card">
      <div class="card-head"><span class="creator">${esc(o.c.name)}</span><span class="count">${o.n}人</span><span class="confirm">確認 ${o.ok}/${o.n}</span></div>
      ${o.likes.map((l) => { const s = seed(l.seed); const e = l.evidence[0]; return `<div class="row" data-like="${l.id}">
        <div class="who">${esc(s.name)}<small>${esc(s.role)}</small></div>
        <div class="quote">${esc(e.translation || e.quote)}</div>
        <div class="meta"><span class="works">${l.works.length ? l.works.map((w) => `『${esc(w)}』`).join(" ") : "作家として"}</span>
          <a href="${href(e)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${sourceBit(e)}</a>${tags(l)}</div></div>`; }).join("")}
    </section>`).join("") || '<p class="empty">まだ重なりはありません。</p>'}`;
}
function renderShelf(id) {
  const s = seed(id);
  const mine = D.likes.filter((l) => l.seed === id);
  const shown = mine.filter((l) => st(l) !== "rejected")
    .sort((a, b) => (st(b) === "approved") - (st(a) === "approved") || b.evidence.length - a.evidence.length || creator(a.creator).name.localeCompare(creator(b.creator).name, "ja"));
  const rej = mine.filter((l) => st(l) === "rejected");
  $("main").innerHTML = `<h1>${esc(s.name)} の棚</h1>
    <p class="lead">${esc(s.role)}${s.aliases.length ? `・別名: ${s.aliases.map(esc).join("、")}` : ""}・「好き」${shown.length}件</p>
    <section class="card">${shown.map((l) => { const c = creator(l.creator); const e = l.evidence[0]; const n = overlapCount(l.creator); return `<div class="shelf-item" data-like="${l.id}">
      <div class="quote">${esc(e.translation || e.quote)}</div>
      <div class="meta"><span class="creator">${esc(c.name)}</span><span class="works">${l.works.map((w) => `『${esc(w)}』`).join(" ")}</span>
        <a href="${href(e)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${sourceBit(e)}</a>
        ${l.evidence.length > 1 ? `<span>ほか${l.evidence.length - 1}件</span>` : ""}${tags(l)}${n >= 2 ? `<span class="tag ovl">重なり ${n}人</span>` : ""}</div></div>`; }).join("") || '<p class="empty">「好き」はまだありません。</p>'}</section>
    ${rej.length ? `<div class="muted-list">却下した ${rej.length} 件: ${rej.map((l) => `${esc(creator(l.creator).name)} <button class="btn" data-undo="${l.id}">元に戻す</button>`).join(" ")}</div>` : ""}`;
}
function renderCurious() {
  const items = Object.entries(S.curious).sort((a, b) => b[1] - a[1]).map(([k]) => k.split("|"));
  $("main").innerHTML = `<h1>気になる作品</h1><p class="lead">☆を付けた作品です。</p><section class="card">${items.map(([cid, w]) => { const c = creator(cid);
    const who = D.likes.filter((l) => l.creator === cid && l.works.includes(w)).map((l) => seed(l.seed).name);
    return `<div class="shelf-item"><div class="creator">『${esc(w)}』 <small>${esc(c.name)}</small></div>
      <div class="meta"><span>${who.map(esc).join("、")} が挙げた</span><a href="${shopUrl(c, w)}" target="_blank" rel="noopener">${c.domain === "music" ? "Spotify で探す" : "Amazon で探す"}</a>
      <button class="star on" data-star="${esc(cid)}|${esc(w)}">☆ 外す</button></div></div>`; }).join("") || '<p class="empty">まだありません。根拠パネルの作品に☆を付けてください。</p>'}</section>`;
}

let openLike = null;
function openDrawer(id) {
  openLike = D.likes.find((l) => l.id === id);
  const l = openLike, s = seed(l.seed), c = creator(l.creator);
  $("drawer").innerHTML = `<button class="close" data-close>×</button>
    <div class="kbd">根拠</div><h1>${esc(s.name)} → ${esc(c.name)}</h1>
    <div>${tags(l)}</div>
    ${l.evidence.map((e) => { const src = D.sources[e.source]; return `<div class="ev">
      <div class="quote">${esc(e.quote)}</div>${e.translation ? `<div class="tr">訳: ${esc(e.translation)}</div>` : ""}
      <div class="src">${e.attribution === "third_party" ? "記者などの記述 · " : "本人の発言 · "}${e.match === "fuzzy" ? "自動字幕とあいまいに照合 · " : ""}${esc(src.title)}</div>
      ${src.kind === "video" && e.startSec != null ? `<a class="play" href="${href(e)}" target="_blank" rel="noopener">▶ ${fmt(e.startSec)} から再生</a>` : `<a class="src" href="${href(e)}" target="_blank" rel="noopener">記事を開く ↗</a>`}
    </div>`; }).join("")}
    ${l.works.length ? `<div class="kbd">挙げた作品</div>${l.works.map((w) => { const k = curiousKey(c.id, w); return `<div class="work-line">『${esc(w)}』
      <button class="star ${S.curious[k] ? "on" : ""}" data-star="${esc(k)}">☆ 気になる</button><a href="${shopUrl(c, w)}" target="_blank" rel="noopener">${c.domain === "music" ? "Spotify" : "Amazon"}</a></div>`; }).join("")}` : ""}
    <div class="actions">
      <button class="btn primary" data-set="approved">確認した（a）</button>
      <button class="btn danger" data-set="rejected">違う・却下（r）</button>
      ${st(l) !== "unverified" ? '<button class="btn" data-set="unverified">未確認に戻す</button>' : ""}
    </div>`;
  $("drawer").classList.add("open"); $("scrim").classList.add("open");
}
function closeDrawer() { openLike = null; $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); }
function setStatus(v) { if (!openLike) return; if (v === "unverified") delete S.status[openLike.id]; else S.status[openLike.id] = v; save(); const id = openLike.id; render(); if (v === "rejected") closeDrawer(); else openDrawer(id); }

function render() {
  const h = location.hash || "#/";
  if (h.startsWith("#/seed/")) { renderNav("seed"); renderShelf(h.slice(7)); }
  else if (h === "#/curious") { renderNav("curious"); renderCurious(); }
  else { renderNav("overlaps"); renderOverlaps(); }
}
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-like],[data-star],[data-set],[data-close],[data-undo]");
  if (!t) return;
  if (t.dataset.like) openDrawer(t.dataset.like);
  else if (t.dataset.star) { const k = t.dataset.star; if (S.curious[k]) delete S.curious[k]; else S.curious[k] = Date.now(); save(); render(); if (openLike) openDrawer(openLike.id); }
  else if (t.dataset.set) setStatus(t.dataset.set);
  else if (t.dataset.undo) { delete S.status[t.dataset.undo]; save(); render(); }
  else if (t.dataset.close !== undefined) closeDrawer();
});
$("scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDrawer();
  if (!openLike) return;
  if (e.key === "a") setStatus("approved");
  if (e.key === "r") setStatus("rejected");
});
window.addEventListener("hashchange", () => { closeDrawer(); render(); });
fetch("/data/likes.json").then((r) => { if (!r.ok) throw new Error("spike/data/likes.json がありません"); return r.json(); })
  .then((d) => { D = d; render(); })
  .catch((e) => { $("main").innerHTML = `<p class="empty">${esc(e.message)}</p>`; });
</script>
</body>
</html>
